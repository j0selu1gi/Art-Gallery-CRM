<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do Tell · Gallery at a glance</title>
<link rel="stylesheet" href="kimi-standalone.css">
<style>
  html, body { height: 100%; }
  body { margin: 0; }
  .wrap {
    position: relative;
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    font-family: var(--kimi-font-sans);
    color: var(--kimi-color-text-primary);
    padding-block-start: var(--kimi-space-4);
    padding-inline: var(--kimi-space-4);
    padding-block-end: var(--kimi-space-3);
    gap: var(--kimi-space-3);
  }
  button, input, select, textarea { font: inherit; }
  svg text { font-family: var(--kimi-font-sans); }

  /* Header — kept non-interactive; Canvas drag strip overlays the top edge */
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--kimi-space-3); min-height: 40px; }
  .wordmark { font-family: var(--kimi-font-serif); font-size: 20px; font-weight: 500; }
  .wordmark small { font-family: var(--kimi-font-sans); font-size: 12px; color: var(--kimi-color-text-tertiary); margin-left: var(--kimi-space-2); letter-spacing: 0.04em; }
  .today { font-size: 12px; color: var(--kimi-color-text-tertiary); font-variant-numeric: tabular-nums; }

  .tabs { display: flex; gap: var(--kimi-space-1); border-bottom: 0.5px solid var(--kimi-color-border); padding-bottom: var(--kimi-space-2); }
  .tab {
    border: none; background: transparent; cursor: pointer;
    padding: 4px 10px; border-radius: var(--kimi-radius-chip);
    font-size: 14px; color: var(--kimi-color-text-secondary);
    transition: background var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out);
  }
  .tab:hover { background: var(--kimi-color-surface-muted); }
  .tab.is-selected { color: var(--kimi-color-text-primary); background: var(--kimi-color-surface-muted); font-weight: 500; }

  .view { flex: 1; min-height: 0; overflow-y: auto; display: none; }
  .view.active { display: block; }

  .view-toolbar { display: flex; align-items: center; justify-content: space-between; gap: var(--kimi-space-3); margin-bottom: var(--kimi-space-2); }
  .view-hint { font-size: 12px; color: var(--kimi-color-text-quaternary); }

  .grid2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: var(--kimi-space-3); }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--kimi-space-3); }
  .panel { border: 0.5px solid var(--kimi-color-border); border-radius: var(--kimi-radius-panel); padding: var(--kimi-space-3); }
  .label { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-bottom: 2px; }
  .value { font-size: 26px; font-weight: 500; line-height: 1.15; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .sub { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-top: 2px; }

  .cover { width: 100%; aspect-ratio: 21 / 9; border-radius: var(--kimi-radius-input); display: block; border: 0.5px solid var(--kimi-color-border); }
  .cover-sm { width: 64px; height: 44px; border-radius: var(--kimi-radius-chip); flex: none; border: 0.5px solid var(--kimi-color-border); }

  .show-title { font-family: var(--kimi-font-serif); font-size: 20px; font-weight: 500; margin-top: var(--kimi-space-2); }
  .show-meta { font-size: 14px; color: var(--kimi-color-text-secondary); margin-top: 2px; }
  .show-dates { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-top: 2px; font-variant-numeric: tabular-nums; }

  .chip { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: var(--kimi-radius-full); white-space: nowrap; }
  .chip-solo { color: var(--kimi-color-accent); background: color-mix(in srgb, var(--kimi-color-accent) 12%, transparent); }
  .chip-curated { color: var(--kimi-chart-4); background: color-mix(in srgb, var(--kimi-chart-4) 12%, transparent); }
  .chip-dodo { color: var(--kimi-chart-3); background: color-mix(in srgb, var(--kimi-chart-3) 14%, transparent); }
  .chip-sold { color: var(--kimi-color-positive); background: color-mix(in srgb, var(--kimi-color-positive) 12%, transparent); }
  .chip-available { color: var(--kimi-color-text-secondary); background: var(--kimi-color-surface-muted); }
  .chip-confirmed { color: var(--kimi-color-positive); background: color-mix(in srgb, var(--kimi-color-positive) 12%, transparent); }
  .chip-proposed { color: var(--kimi-color-warning); background: color-mix(in srgb, var(--kimi-color-warning) 14%, transparent); }

  .row-item { display: flex; align-items: center; gap: var(--kimi-space-3); padding: var(--kimi-space-2) var(--kimi-space-1); border-bottom: 0.5px solid var(--kimi-color-border); border-radius: var(--kimi-radius-small); }
  .row-item:last-child { border-bottom: none; }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-sub { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-top: 1px; }
  .row-end { text-align: right; flex: none; font-variant-numeric: tabular-nums; }

  /* Clickable catalog entries */
  .is-clickable { cursor: pointer; transition: background var(--t-fast) var(--ease-out); }
  .is-clickable:hover { background: var(--kimi-color-surface-muted); }
  tr.is-clickable:hover td { background: var(--kimi-color-surface-muted); }

  table.kimi-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .kimi-table th { text-align: left; font-weight: 500; font-size: 12px; color: var(--kimi-color-text-tertiary); padding: 4px 8px; border-bottom: 0.5px solid var(--kimi-color-border); }
  .kimi-table td { padding: 6px 8px; border-bottom: 0.5px solid var(--kimi-color-border); }
  .kimi-table tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

  .section-title { font-size: 17px; font-weight: 500; margin: var(--kimi-space-3) 0 var(--kimi-space-2); }
  .section-title:first-child { margin-top: 0; }
  .ex-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--kimi-space-3); }
  .ex-card { border: 0.5px solid var(--kimi-color-border); border-radius: var(--kimi-radius-panel); padding: var(--kimi-space-2); transition: background var(--t-fast) var(--ease-out); }
  .ex-card.is-clickable:hover { background: var(--kimi-color-surface-muted); }
  .ex-card .cover { aspect-ratio: 16 / 7; }
  .ex-name { font-family: var(--kimi-font-serif); font-size: 15px; font-weight: 500; margin-top: var(--kimi-space-2); }
  .mono-note { font-size: 12px; color: var(--kimi-color-text-quaternary); margin-top: var(--kimi-space-3); }

  /* Detail / edit drawer */
  .drawer-veil { position: absolute; inset: 0; z-index: 20; display: flex; justify-content: flex-end; background: color-mix(in srgb, var(--kimi-color-text-primary) 16%, transparent); animation: veilIn var(--t-fast) var(--ease-out); }
  .drawer-veil[hidden] { display: none; }
  @keyframes veilIn { from { opacity: 0; } to { opacity: 1; } }
  .drawer {
    width: min(420px, 94%); height: 100%; box-sizing: border-box;
    background: var(--kimi-color-surface-raised); border-left: 0.5px solid var(--kimi-color-border);
    border-radius: var(--kimi-radius-large) 0 0 var(--kimi-radius-large);
    display: flex; flex-direction: column;
    animation: drawerIn var(--t-normal) var(--ease-out);
  }
  @keyframes drawerIn { from { transform: translateX(24px); opacity: 0.4; } to { transform: translateX(0); opacity: 1; } }
  .drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--kimi-space-3); padding: var(--kimi-space-4) var(--kimi-space-4) var(--kimi-space-2); }
  .drawer-title { font-size: 17px; font-weight: 500; line-height: 1.3; }
  .drawer-kind { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-top: 2px; }
  .drawer-close { border: none; background: transparent; cursor: pointer; font-size: 16px; color: var(--kimi-color-text-secondary); width: 28px; height: 28px; border-radius: var(--kimi-radius-button); flex: none; line-height: 1; }
  .drawer-close:hover { background: var(--kimi-color-surface-muted); color: var(--kimi-color-text-primary); }
  .drawer-body { flex: 1; min-height: 0; overflow-y: auto; padding: var(--kimi-space-2) var(--kimi-space-4); display: flex; flex-direction: column; gap: var(--kimi-space-3); }
  .drawer-foot { display: flex; align-items: center; gap: var(--kimi-space-2); padding: var(--kimi-space-3) var(--kimi-space-4) var(--kimi-space-4); border-top: 0.5px solid var(--kimi-color-border); }
  .drawer-foot .spacer { flex: 1; }
  .drawer-status { font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .drawer-status.is-error { color: var(--kimi-color-danger); }
  .drawer-status.is-ok { color: var(--kimi-color-positive); }
  .f-label { font-size: 12px; color: var(--kimi-color-text-secondary); display: block; margin-bottom: 4px; }
  .f-input, .f-select, .f-textarea {
    width: 100%; box-sizing: border-box; font-size: 14px; color: var(--kimi-color-text-primary);
    background: var(--kimi-color-surface); border: 0.5px solid var(--kimi-color-border);
    border-radius: var(--kimi-radius-input); padding: 7px 10px; outline: none;
  }
  .f-input:focus, .f-select:focus, .f-textarea:focus { border-color: var(--kimi-color-text-primary); }
  .f-textarea { resize: vertical; min-height: 72px; line-height: 1.45; }
  .f-check { display: flex; align-items: center; gap: var(--kimi-space-2); font-size: 14px; cursor: pointer; }
  .f-check input { accent-color: var(--kimi-color-text-primary); width: 15px; height: 15px; }
  .f-group { border: 0.5px solid var(--kimi-color-border); border-radius: var(--kimi-radius-panel); padding: var(--kimi-space-2) var(--kimi-space-3); display: flex; flex-direction: column; gap: var(--kimi-space-1); }
  .f-group-title { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-bottom: 2px; }
  .btn { border: none; cursor: pointer; font-size: 14px; border-radius: var(--kimi-radius-button); padding: 7px 14px; transition: background var(--t-fast) var(--ease-out), color var(--t-fast) var(--ease-out), opacity var(--t-fast) var(--ease-out); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn-primary { background: var(--kimi-color-text-primary); color: var(--kimi-color-surface); }
  .btn-primary:not(:disabled):hover { opacity: 0.85; }
  .btn-secondary { background: var(--kimi-color-surface-muted); color: var(--kimi-color-text-primary); }
  .btn-secondary:not(:disabled):hover { background: color-mix(in srgb, var(--kimi-color-text-primary) 10%, transparent); }
  .btn-ghost { background: transparent; color: var(--kimi-color-text-secondary); border: 0.5px solid var(--kimi-color-border); }
  .btn-ghost:not(:disabled):hover { color: var(--kimi-color-text-primary); border-color: var(--kimi-color-text-tertiary); }
  .btn-danger { background: transparent; color: var(--kimi-color-danger); border: 0.5px solid color-mix(in srgb, var(--kimi-color-danger) 40%, transparent); }
  .btn-danger:not(:disabled):hover { background: color-mix(in srgb, var(--kimi-color-danger) 10%, transparent); }
  .btn-add { font-size: 13px; padding: 5px 12px; }
</style>
</head>

  let shapes = '';
  const n = 4 + Math.floor(r() * 3);
  for (let i = 0; i < n; i++) {
    const c = i === 0 ? accent : tones[Math.floor(r() * tones.length)];
    const kind = r();
    const x = r() * W, y = r() * H, s = 24 + r() * 70;
    if (kind < 0.35) shapes += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(s / 2).toFixed(0)}" fill="${c}"/>`;
    else if (kind < 0.6) shapes += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(s / 2).toFixed(0)}" fill="none" stroke="${c}" stroke-width="10"/>`;
    else if (kind < 0.8) shapes += `<rect x="${x.toFixed(0)}" y="${(y - s / 2).toFixed(0)}" width="${(s * 1.3).toFixed(0)}" height="${s.toFixed(0)}" fill="${c}"/>`;
    else shapes += `<path d="M ${x.toFixed(0)} ${y.toFixed(0)} a ${(s / 2).toFixed(0)} ${(s / 2).toFixed(0)} 0 0 1 ${s.toFixed(0)} 0 z" fill="${c}"/>`;
  }
  return `<svg class="${cls}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Generated exhibition cover"><rect width="${W}" height="${H}" fill="var(--kimi-color-surface-muted)"/>${shapes}</svg>`;
}

const typeChip = t => t === 'solo' ? '<span class="chip chip-solo">Solo show</span>'
  : t === 'curated' ? '<span class="chip chip-curated">Curated</span>'
  : '<span class="chip chip-dodo">DoDoFriday</span>';

// Next second Saturday / fourth Saturday (this month if still upcoming, else next)
function nextOf(fn) {
  const n = new Date();
  for (let off = 0; off <= 1; off++) {
    const base = new Date(n.getFullYear(), n.getMonth() + off, 1);
    const d = fn(base.getFullYear(), base.getMonth());
    if (d >= new Date(n.getFullYear(), n.getMonth(), n.getDate())) return d;
  }
}

// ---------- Drawer: view / edit / add records ----------
const KIND_LABEL = { artists: 'artist', artworks: 'artwork', exhibitions: 'exhibition', plans: 'month plan' };
const ID_PREFIX = { artists: 'artist', artworks: 'art', exhibitions: 'ex' };
const veilEl = document.getElementById('drawer-veil');
const bodyEl = document.getElementById('drawer-body');
const titleEl = document.getElementById('drawer-title');
const kindEl = document.getElementById('drawer-kind');
const statusEl = document.getElementById('drawer-status');
const saveBtn = document.getElementById('drawer-save');
const deleteBtn = document.getElementById('drawer-delete');
const cancelBtn = document.getElementById('drawer-cancel');
const closeBtn = document.getElementById('drawer-close');

let openRef = null;      // {collection, id?} | {collection:'plans', key?}
let draftMode = 'edit';  // 'edit' | 'create'
let savePhase = 'idle';  // 'idle' | 'saving' | 'saved' | 'error'
let deleteArmed = false;
let draftRec = null;
let savedTimer = null;
let deleteTimer = null;

function genId(collection) {
  return ID_PREFIX[collection] + '-' + Math.random().toString(16).slice(2, 10);
}

function fieldDefs(collection) {
  if (collection === 'artists') return [
    { k: 'name', label: 'Name', type: 'text', req: true, ph: 'Full name' },
    { k: 'status', label: 'Status', type: 'select', options: [['shown', 'Shown at the gallery'], ['upcoming', 'Upcoming'], ['archived', 'Archived']] },
    { k: 'location', label: 'Location', type: 'text', ph: 'City, ST' },
    { k: 'mediums', label: 'Mediums', type: 'text', list: true, ph: 'Painting, Ceramics…' },
    { k: 'email', label: 'Email', type: 'text' },
    { k: 'phone', label: 'Phone', type: 'text' },
    { k: 'instagram', label: 'Instagram', type: 'text', ph: '@handle' },
    { k: 'website', label: 'Website', type: 'text', ph: 'https://…' },
    { k: 'bio', label: 'Bio', type: 'textarea' },
    { k: 'notes', label: 'Internal notes', type: 'textarea' },
  ];
  if (collection === 'artworks') return [
    { k: 'title', label: 'Title', type: 'text', req: true, ph: 'Artwork title' },
    { k: 'artistId', label: 'Artist', type: 'artist' },
    { k: 'year', label: 'Year', type: 'number' },
    { k: 'medium', label: 'Medium', type: 'text', ph: 'Oil on linen' },
    { k: 'dimensions', label: 'Dimensions', type: 'text', ph: '36 × 48 in' },
    { k: 'price', label: 'Price (USD)', type: 'number' },
    { k: 'sold', label: 'Sold', type: 'checkbox' },
    { k: 'soldDate', label: 'Date sold', type: 'date' },
    { k: 'exhibitionIds', label: 'Exhibited in', type: 'exhibitions' },
  ];
  return [
    { k: 'title', label: 'Title', type: 'text', req: true, ph: 'Exhibition title' },
    { k: 'type', label: 'Type', type: 'select', options: [['solo', 'Solo show'], ['curated', 'Curated'], ['craft-night', 'DoDoFriday craft night']] },
    { k: 'artistId', label: 'Featured artist', type: 'artist', optional: true },
    { k: 'status', label: 'Status', type: 'select', options: [['upcoming', 'Upcoming'], ['current', 'On now'], ['proposed', 'Proposed'], ['past', 'Past']] },
    { k: 'openingDate', label: 'Opening date', type: 'date' },
    { k: 'closingDate', label: 'Closing date', type: 'date' },
    { k: 'description', label: 'Description', type: 'textarea' },
  ];
}

function planDefs() {
  return [
    { k: 'soloArtistId', label: 'Solo artist', type: 'artist', optional: true },
    { k: 'soloStatus', label: 'Solo status', type: 'select', options: [['open', 'Open slot'], ['confirmed', 'Confirmed'], ['proposed', 'Proposed']] },
    { k: 'dodoTheme', label: 'DoDoFriday theme', type: 'text', ph: 'e.g. Paper lanterns' },
  ];
}

function buildField(def, rec) {
  const v = rec[def.k];
  if (def.type === 'textarea') {
    return `<label><span class="f-label">${esc(def.label)}</span><textarea class="f-textarea" data-f="${def.k}" rows="4">${esc(v)}</textarea></label>`;
  }
  if (def.type === 'select') {
    const opts = def.options.map(([val, lab]) => `<option value="${val}"${String(v) === val ? ' selected' : ''}>${lab}</option>`).join('');
    return `<label><span class="f-label">${esc(def.label)}</span><select class="f-select" data-f="${def.k}">${opts}</select></label>`;
  }
  if (def.type === 'artist') {
    const empty = def.optional ? `<option value=""${!v ? ' selected' : ''}>— none —</option>` : '';
    const opts = DATA.artists.map(a => `<option value="${esc(a.id)}"${a.id === v ? ' selected' : ''}>${esc(a.name)}</option>`).join('');
    return `<label><span class="f-label">${esc(def.label)}</span><select class="f-select" data-f="${def.k}">${empty}${opts}</select></label>`;
  }
  if (def.type === 'exhibitions') {
    const boxes = DATA.exhibitions.map(e =>
      `<label class="f-check"><input type="checkbox" data-fx="${esc(e.id)}"${(Array.isArray(v) && v.indexOf(e.id) !== -1) ? ' checked' : ''}> ${esc(e.title)}</label>`
    ).join('');
    return `<div class="f-group"><div class="f-group-title">${esc(def.label)}</div>${boxes || '<div class="f-group-title">No exhibitions yet</div>'}</div>`;
  }
  if (def.type === 'checkbox') {
    return `<label class="f-check"><input type="checkbox" data-f="${def.k}"${v ? ' checked' : ''}> ${esc(def.label)}</label>`;
  }
  if (def.list) {
    const val = Array.isArray(v) ? v.join(', ') : (v || '');
    return `<label><span class="f-label">${esc(def.label)}</span><input class="f-input" type="text" data-f="${def.k}" value="${esc(val)}"${def.ph ? ` placeholder="${esc(def.ph)}"` : ''}></label>`;
  }
  const type = def.type === 'number' ? 'number' : def.type === 'date' ? 'date' : 'text';
  const val = v == null ? '' : v;
  const step = type === 'number' ? ' step="1" min="0"' : '';
  return `<label><span class="f-label">${esc(def.label)}</span><input class="f-input" type="${type}" data-f="${def.k}" value="${esc(val)}"${def.ph ? ` placeholder="${esc(def.ph)}"` : ''}${step}></label>`;
}

function collectFromDefs(defs) {
  const rec = {};
  defs.forEach(def => {
    if (def.type === 'exhibitions') {
      const checked = bodyEl.querySelectorAll ? bodyEl.querySelectorAll('input[data-fx]:checked') : [];
      rec[def.k] = Array.from(checked).map(i => i.getAttribute('data-fx'));
      return;
    }
    const el = bodyEl.querySelector ? bodyEl.querySelector(`[data-f="${def.k}"]`) : null;
    if (!el) return;
    if (def.type === 'checkbox') rec[def.k] = el.checked;
    else if (def.type === 'number') rec[def.k] = el.value === '' ? '' : Number(el.value);
    else if (def.list) rec[def.k] = el.value.split(',').map(s => s.trim()).filter(Boolean);
    else rec[def.k] = el.value;
  });
  return rec;
}

function defaultRecord(collection) {
  if (collection === 'artists') return { id: openRef.id, name: '', status: 'shown', location: 'Austin, TX', email: '', phone: '', instagram: '', website: '', bio: '', notes: '', mediums: [] };
  if (collection === 'artworks') return { id: openRef.id, artistId: (DATA.artists[0] || {}).id || '', title: '', year: new Date().getFullYear(), medium: '', dimensions: '', price: '', sold: false, soldDate: '', exhibitionIds: [] };
  return { id: openRef.id, title: '', type: 'solo', artistId: '', status: 'upcoming', openingDate: '', closingDate: '', description: '' };
}

function drawerRecord() {
  if (!openRef) return null;
  if (draftMode === 'create') {
    if (!draftRec) draftRec = defaultRecord(openRef.collection);
    return draftRec;
  }
  if (openRef.collection === 'plans') {
    return Object.assign({ soloArtistId: '', soloStatus: 'open', dodoTheme: '' }, DATA.plans[openRef.key] || {});
  }
  const found = DATA[openRef.collection].find(r => r.id === openRef.id);
  return found || null;
}

function recordExists() {
  if (!openRef) return false;
  if (openRef.collection === 'plans') return !!DATA.plans[openRef.key];
  return DATA[openRef.collection].some(r => r.id === openRef.id);
}

function planTitle(key) {
  const parts = String(key).split('-').map(Number);
  if (parts.length < 2 || !parts[0] || !parts[1]) return String(key);
  return new Date(parts[0], parts[1] - 1, 1).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
}

function showDrawer() {
  renderDrawer();
  if (veilEl) veilEl.hidden = false;
}

function closeDrawer() {
  openRef = null;
  draftRec = null;
  savePhase = 'idle';
  deleteArmed = false;
  clearTimeout(savedTimer);
  if (veilEl) veilEl.hidden = true;
}

function flashStatus(cls, text) {
  statusEl.className = 'drawer-status' + (cls ? ' ' + cls : '');
  statusEl.textContent = text;
}

function updateFoot() {
  const running = savePhase === 'saving';
  if (saveBtn) saveBtn.disabled = running || !canSubmit;
  if (deleteBtn) deleteBtn.disabled = running || !canSubmit;
  if (!canSubmit) { flashStatus('', 'Catalog sync is not connected in this preview'); return; }
  if (savePhase === 'saving') flashStatus('', deleteArmed ? 'Deleting…' : 'Saving…');
  else if (savePhase === 'saved') flashStatus('is-ok', 'Saved');
  else if (savePhase === 'error') flashStatus('is-error', "Couldn't save — try again");
  else flashStatus('', '');
}

function renderDrawer() {
  if (!openRef || !bodyEl) return;
  const isPlan = openRef.collection === 'plans';
  const defs = isPlan ? planDefs() : fieldDefs(openRef.collection);
  let rec = drawerRecord();
  if (!rec) { closeDrawer(); return; }
  // Keep unsaved typed values when a background sync re-renders the form.
  const hasForm = !!(bodyEl.querySelector && bodyEl.querySelector('[data-f]'));
  if (savePhase === 'idle' && hasForm) {
    rec = Object.assign({}, rec, collectFromDefs(defs));
    if (draftMode === 'create') draftRec = rec;
  }
  if (titleEl) titleEl.textContent = isPlan ? planTitle(openRef.key) : (rec.name || rec.title || 'Untitled');
  if (kindEl) kindEl.textContent = (draftMode === 'create' ? 'New ' : 'Edit ') + KIND_LABEL[openRef.collection];
  bodyEl.innerHTML = defs.map(d => buildField(d, rec)).join('');
  if (deleteBtn) {
    deleteBtn.hidden = draftMode === 'create' || (isPlan && !DATA.plans[openRef.key]);
    if (!deleteArmed) deleteBtn.textContent = 'Delete';
  }
  updateFoot();
}

function openEntry(collection, id) {
  openRef = { collection, id };
  draftMode = 'edit';
  savePhase = 'idle';
  deleteArmed = false;
  draftRec = null;
  showDrawer();
}

function openPlan(key) {
  openRef = { collection: 'plans', key };
  draftMode = 'edit';
  savePhase = 'idle';
  deleteArmed = false;
  draftRec = null;
  showDrawer();
}

function openCreate(collection) {
  draftMode = 'create';
  openRef = { collection, id: genId(collection) };
  savePhase = 'idle';
  deleteArmed = false;
  draftRec = null;
  showDrawer();
}

function onSave() {
  if (!openRef || !canSubmit || savePhase === 'saving') return;
  const isPlan = openRef.collection === 'plans';
  const defs = isPlan ? planDefs() : fieldDefs(openRef.collection);
  const rec = collectFromDefs(defs);
  if (!isPlan) {
    const missingName = defs.some(d => d.req && !String(rec[d.k] || '').trim());
    if (missingName) { flashStatus('is-error', 'Name is required'); return; }
    rec.id = openRef.id;
  }
  const payload = isPlan
    ? { action: 'update', collection: 'plans', key: openRef.key, record: rec }
    : { action: draftMode === 'create' ? 'create' : 'update', collection: openRef.collection, id: rec.id, record: rec };
  savePhase = 'saving';
  draftRec = rec;
  updateFoot();
  host.emit('submit', payload);
}

function onDelete() {
  if (!openRef || !canSubmit || savePhase === 'saving') return;
  if (!deleteArmed) {
    deleteArmed = true;
    deleteBtn.textContent = 'Confirm delete';
    clearTimeout(deleteTimer);
    deleteTimer = setTimeout(() => { deleteArmed = false; if (deleteBtn) deleteBtn.textContent = 'Delete'; }, 3000);
    return;
  }
  const payload = openRef.collection === 'plans'
    ? { action: 'delete', collection: 'plans', key: openRef.key }
    : { action: 'delete', collection: openRef.collection, id: openRef.id };
  savePhase = 'saving';
  updateFoot();
  host.emit('submit', payload);
}

function completeSave() {
  if (!openRef) { savePhase = 'idle'; return; }
  savePhase = 'saved';
  if (draftMode === 'create') draftMode = 'edit';
  if (!recordExists()) { closeDrawer(); return; }
  renderDrawer();
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => {
    if (savePhase === 'saved') { savePhase = 'idle'; updateFoot(); }
  }, 2500);
}

function handleStatusChange() {
  if (!hasStatus || savePhase !== 'saving') return;
  const st = host.status;
  if (st === 'idle' || st === 'degraded' || st === 'needs_input') completeSave();
  else if (st === 'error' || st === 'cancelled') { savePhase = 'error'; updateFoot(); }
}

function handleData(d) {
  DATA = normalize(d && d.main);
  renderAll();
  if (!openRef) return;
  if (savePhase === 'saving') {
    if (!hasStatus) completeSave(); // hosts without a status API: delivery means done
    return;
  }
  if (draftMode === 'edit' && !recordExists()) { closeDrawer(); return; }
  renderDrawer();
}

    const wc = WORKS.filter(w => workEx(w).indexOf(e.id) !== -1).length; return `
    <div class="ex-card is-clickable" data-open="exhibitions" data-id="${esc(e.id)}" role="button" tabindex="0">
      ${coverSVG(e.id, 'cover')}
      <div class="ex-name">${esc(e.title)}</div>
      <div class="show-dates">${typeChip(e.type)} ${e.artistId ? esc(artistName(e.artistId)) + ' · ' : ''}${fmt(d.open)}${d.close.getTime() !== d.open.getTime() ? ' – ' + fmt(d.close) : ''}</div>
      <div class="row-sub" style="margin-top: 2px;">${wc ? wc + ' works exhibited' : 'Community craft night'}</div>
    </div>`; }).join('')}</div>` : '').join('');

  // Six months forward from the current month; months without a plan are open slots
  const now = new Date();
  const months = [];
  for (let off = 0; off < 6; off++) {
    const base = new Date(now.getFullYear(), now.getMonth() + off, 1);
    months.push({ year: base.getFullYear(), month: base.getMonth() });
  }
  const planEl = document.getElementById('view-planning');
  if (planEl) planEl.innerHTML = `
  <div class="view-toolbar">
    <span class="view-hint">Click a month to assign the solo show or set the DoDoFriday theme</span>
  </div>` +
  months.map(({ year, month }) => {
    const key = monthKey(year, month);
    const plan = PLANS[key];
    const open = secondSaturday(year, month);
    const dd = fourthSaturday(year, month);
    const monthName = open.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    const status = plan ? plan.soloStatus : 'open';
    return `<div class="row-item is-clickable" data-open="plans" data-key="${key}" role="button" tabindex="0">
    <div class="row-main">
      <div class="row-title">${monthName}</div>
      <div class="row-sub">Solo opens ${fmt(open)}${plan && plan.soloArtistId ? ' · ' + esc(artistName(plan.soloArtistId)) : ' · unassigned'} · DoDoFriday ${fmt(dd)}${plan && plan.dodoTheme ? ' · ' + esc(plan.dodoTheme) : ''}</div>
    </div>
    <span class="chip ${status === 'confirmed' ? 'chip-confirmed' : status === 'proposed' ? 'chip-proposed' : 'chip-available'}">${status === 'open' ? 'Open slot' : esc(status)}</span>
  </div>`;
  }).join('') + `<div class="mono-note">Solo shows open the second Saturday · DoDoFridays land the fourth Saturday · edits here save back to the Do Tell app catalog</div>`;

  VIEW_IDS.forEach(id => { const el = document.getElementById(id); if (el) el.scrollTop = scroll[id] || 0; });
}

renderAll();

// Live updates from the sync task (guarded: not every host exposes subscriptions)
if (host && typeof host.onDataChange === 'function') {
  host.onDataChange(handleData);
}
if (hasStatus) {
  host.onStatusChange(handleStatusChange);
}

// ---------- Click routing (delegated so re-renders never rebind) ----------
if (typeof document.addEventListener === 'function') {
  document.addEventListener('click', e => {
    const t = e.target;
    if (!t || typeof t.closest !== 'function') return;
    if (t === veilEl) { closeDrawer(); return; }
    if (typeof closeBtn !== 'undefined' && t === closeBtn) { closeDrawer(); return; }
    if (typeof cancelBtn !== 'undefined' && t === cancelBtn) { closeDrawer(); return; }
    if (typeof saveBtn !== 'undefined' && t === saveBtn) { onSave(); return; }
    if (typeof deleteBtn !== 'undefined' && t === deleteBtn) { onDelete(); return; }
    const addBtn = t.closest('[data-add]');
    if (addBtn) { openCreate(addBtn.getAttribute('data-add')); return; }
    const opener = t.closest('[data-open]');
    if (opener) {
      const c = opener.getAttribute('data-open');
      if (c === 'plans') openPlan(opener.getAttribute('data-key'));
      else openEntry(c, opener.getAttribute('data-id'));
    }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && openRef) { closeDrawer(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && e.target && typeof e.target.closest === 'function') {
      const opener = e.target.closest('[data-open]');
      if (opener) {
        e.preventDefault();
        const c = opener.getAttribute('data-open');
        if (c === 'plans') openPlan(opener.getAttribute('data-key'));
        else openEntry(c, opener.getAttribute('data-id'));
      }
    }
  });
}

// ---------- Tabs ----------
if (typeof document.querySelectorAll === 'function') {
  document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => { b.classList.toggle('is-selected', b === btn); b.setAttribute('aria-selected', b === btn ? 'true' : 'false'); });
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + btn.getAttribute('data-view')));
  }));
}
</script>
</body>
</html>
